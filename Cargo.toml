[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

# Release automation (just-github-actions-n-workflows): the whole workspace
# is one versioned module, tagged jbm@<version>.
[workspace.metadata.justactions]
name = "jbm"
gitCommitScopeRelatedNames = ["core", "client", "server", "game", "modhost", "testkit"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
jbm-core = { path = "crates/core" }
jbm-client = { path = "crates/client" }
jbm-server = { path = "crates/server" }
jbm-testkit = { path = "crates/testkit" }
criterion = "0.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wgpu = "30.0.1"
pollster = "1.0.1"
# The one allowed wgpu-version-coupled dependency set (task 2.12's
# exception): egui-wgpu 0.37 needs wgpu 30 and winit 0.30, which match.
# A future wgpu upgrade must wait for a matching egui release.
egui = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
egui-wgpu = { version = "0.37", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
winit = "0.30"
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
font8x8 = "0.3.1"
redb = "=3.1.3"
zstd = "=0.13.3"
tempfile = "=3.27.0"

# Our own crates: light optimization keeps debug runs and tests fast
# (the greedy-mesh property test is ~6x slower at opt-level 0).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# [profile.bench] inherits [profile.release] by default.
