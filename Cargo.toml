[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
jbm-core = { path = "crates/core" }
jbm-client = { path = "crates/client" }
jbm-server = { path = "crates/server" }
wgpu = "30.0.1"
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# [profile.bench] inherits [profile.release] by default.
