[package]
name = "jbm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiles `worldgen::reference`, the hand-written heightmap terrain kept
# as the equivalence-test and bench baseline. Test-only.
reference = []

[dependencies]
jbm-core.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
redb.workspace = true
zstd.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
# Self dev-dependency so `tests/` and `benches/` can enable the
# `reference` feature.
jbm-server = { path = ".", features = ["reference"] }
# The worldgen preview example's PNG output; the workspace's pinned
# version, already a dependency of the client and game crates.
image.workspace = true

[[bench]]
name = "lod_bench"
harness = false

# Task 2.6: one streaming tick of settled and boundary-crossing rings.
[[bench]]
name = "lod_stream_bench"
harness = false

[[bench]]
name = "tick_bench"
harness = false

[[bench]]
name = "worldgen_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false
