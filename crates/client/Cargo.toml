[package]
name = "jbm-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes `jbm_client::testing` (golden-image helpers) to integration tests.
testing = []
# 16³ cubes instead of 32³ (task 1.8 benchmark feature); see jbm-core's
# README for what is and is not supported under it.
cube16 = ["jbm-core/cube16"]

[dependencies]
jbm-core.workspace = true
wgpu.workspace = true
pollster.workspace = true
image.workspace = true
winit.workspace = true
glam.workspace = true
bytemuck.workspace = true
font8x8.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true

[dev-dependencies]
criterion.workspace = true
# Self dev-dependency so `tests/` can enable the `testing` feature.
jbm-client = { path = ".", features = ["testing"] }

[[bench]]
name = "coverage_bench"
harness = false

[[bench]]
name = "mesh_bench"
harness = false
